name: OTA feed

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify OTA feed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify changed feeds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -I .github/scripts/check-ota-download.py --feed-pr-base "$BASE_SHA"
